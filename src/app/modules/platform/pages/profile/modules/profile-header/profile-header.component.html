<header class="profile-header flex flex_align-center">
  <div class="container container_large flex flex_justify-between">
    <p class="text text_body regular c-gradation-300">Поддержка в наших соц. сетях:</p>
    <ul class="socials flex gap-12">
      <li *ngFor="let social of socials">
        <a [href]="social.link" target="_blank">
          <yrx-icon [icon]="social.icon"></yrx-icon>
        </a>
      </li>
    </ul>
  </div>
</header>
