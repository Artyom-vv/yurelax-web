<div class="skins-viewer flex gap-16 flex_align-center">
  <div class="viewer flex flex_column-reverse">
    <canvas #viewer></canvas>
    <div class="flex_justify-self-end flex flex_column gap-12">
      <div class="viewer-actions flex_align-self-end flex gap-4 flex_align-center">
        <p class="text text_body medium c-gradation-500">360°</p>
        <yrx-icon [stroked]="true" icon="refresh-ccw" color="gradation-500"></yrx-icon>
      </div>
      <div class="scrollbar" [formGroup]="form">
<!--        <input formControlName="rotation" type="range" [min]="0" [max]="360" [step]="1">-->
      </div>
    </div>
  </div>
  <div class="loader flex_grow">
    <h3>Загрузить скин игрока</h3>
    <yrx-spacing type="S"></yrx-spacing>
    <p class="text text_body regular c-gradation-300">Технические требования для установки скина</p>
    <yrx-spacing type="XS"></yrx-spacing>
    <yrx-drag-and-drop [loading]="dataLoading" (onChange)="onSelectFile($event)" [iconStroked]="true" icon="file" [accept]="['image/png','image/jpg','image/jpeg']"></yrx-drag-and-drop>
  </div>
</div>
