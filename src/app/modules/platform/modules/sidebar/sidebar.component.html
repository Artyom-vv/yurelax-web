<div class="sidebar flex flex_column">
  <ng-content select="[sidebar-top-content]"></ng-content>
  <div class="sections flex flex_column">
    <ng-container *ngFor="let group of navigation">
      <ul class="flex flex_column">
        <li *ngFor="let link of group; let idx = index">
          <yrx-dropout-point *ngIf="link.isButton; else linkTemplate" [underlined]="group.length-1 !== idx" (press)="link?.callback()" [icon]="link.icon" [iconStroked]="link.iconStroked">
            <span>{{link.name}}</span>
          </yrx-dropout-point>
          <ng-template #linkTemplate>
            <yrx-dropout-point [underlined]="group.length-1 !== idx" [routerLink]="[link.link]" routerLinkActive="active" [rla]="routerLinkActive" #routerLinkActive="routerLinkActive" [icon]="link.icon" [iconStroked]="link.iconStroked">
              <span>{{link.name}}</span>
            </yrx-dropout-point>
          </ng-template>
        </li>
      </ul>
      <yrx-spacing type="S"></yrx-spacing>
    </ng-container>
  </div>
  <ng-content select="[sidebar-bottom-content]"></ng-content>
</div>
