<section [@fadeAnimation]="transitionToMA">
  <yrx-auth-header page="login">Вход</yrx-auth-header>
  <yrx-spacing type="S"></yrx-spacing>
  <p class="text text_body regular c-gradation-200">
    Единый аккаунт Yurelax открывает профиль, покупки и игровые права. Пароль вводится только на защищённой странице авторизации.
  </p>
  <yrx-spacing type="M"></yrx-spacing>
  <yrx-button (press)="login()" class="w100" type="primary" [loading]="dataLoading" [disabled]="dataLoading">
    Войти через Yurelax ID
  </yrx-button>
  <yrx-spacing type="XS"></yrx-spacing>
  <p class="text text_table regular c-gradation-300">
    Регистрация и восстановление доступа доступны на следующем шаге.
  </p>
</section>
