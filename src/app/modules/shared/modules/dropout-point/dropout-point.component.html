<button [attr.custom]="custom" (click)="onClick($event)" class="dropout-point" [ngClass]="'dropout-point_'+size" [class.dropout-point_underlined]="underlined" [class.dropout-point_iconly]="icon" [class.dropout-point_active]="rla?.isActive">
  <span class="icon-wrapper">
    <yrx-icon [stroked]="iconStroked" [color]="rla?.isActive ? 'gradation-300' : 'gradation-100'" [icon]="icon"></yrx-icon>
  </span>
  <ng-content></ng-content>
</button>
