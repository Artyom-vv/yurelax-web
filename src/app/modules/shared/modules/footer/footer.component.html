<yrx-spacing type="XL2"></yrx-spacing>
<footer #footer class="footer">
  <yrx-spacing type="L"></yrx-spacing>
  <div class="container flex flex_column gap-24">
    <div class="flex flex_justify-between">
      <div [routerLink]="'/platform'" class="logotype flex gap-12 flex_align-center">
        <yrx-icon [hover]="false" color="purple-100" icon="yurelax"></yrx-icon>
        <h1 class="headline c-gradation-100">yurelax</h1>
      </div>
      <yrx-button (click)="scrollTop()" type="secondary">
        <span>Вернуться наверх</span>
        <yrx-icon icon="arrow-up" btn-icon></yrx-icon>
      </yrx-button>
    </div>
    <div class="separator"></div>
    <div class="flex flex_align-center flex_justify-between">
      <ul class="flex gap-16">
        <li *ngFor="let social of socials">
          <a [href]="social.link" target="_blank" class="link text text_body medium">{{social.name}}</a>
        </li>
      </ul>
      <ul class="flex gap-24">
        <li><a href="" target="_blank" class="link text text_body medium">Условия пользования</a></li>
        <li><a href="" target="_blank" class="link text text_body medium">Политика конфеденциальности</a></li>
      </ul>
    </div>
  </div>
  <yrx-spacing type="L"></yrx-spacing>
</footer>
