<button [disabled]="disabled" (click)="press.emit($event)" [attr.custom]="custom" mat-button [disableRipple]="true" class="btn" [ngClass]="'btn_'+size+' btn_'+type+' btn_'+custom" [class.btn_iconly]="icon.children.length > 0">
  <ng-content></ng-content>
  <div class="icon-wrapper" #icon>
    <ng-content select="[btn-icon]"></ng-content>
  </div>
</button>
