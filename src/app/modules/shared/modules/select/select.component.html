<div class="box box_select" #boxSelect>
  <mat-select (closed)="closed()" (selectionChange)="onOptionSelect($event.value)" [panelClass]="'select-panel-'+custom" [attr.custom]="custom" [class.select_expanded]="select.panelOpen" [value]="$safeNavigationMigration(selectedOption?.value)" [ngClass]="'select_'+size" [class.select_iconly]="icon.children.length > 0" [placeholder]="placeholder" #select>
    @for (option of options; track option; let idx = $index) {
      <mat-option class="yrx-select-option" [class.yrx-select-option_underlined]="options.length - 1 !== idx" [value]="option.value">
        <span class="yrx-select-option__content" [class.yrx-select-option__content_iconly]="option.icon">
          @if (option.icon) {
            <span class="yrx-select-option__icon" aria-hidden="true">
              <yrx-icon [stroked]="option.iconStroked ?? false" [icon]="option.icon"></yrx-icon>
            </span>
          }
          <span class="yrx-select-option__label">{{option.text}}</span>
        </span>
      </mat-option>
    }
  </mat-select>
  <yrx-icon class="select-arrow" [stroked]="true" icon="chevron-arrow-down"></yrx-icon>
  <div class="icon-wrapper" #icon>
    @if (!selectedOption?.icon) {
      <ng-content select="[select-icon]"></ng-content>
    } @else {
      <yrx-icon [stroked]="selectedOption!.iconStroked ? selectedOption!.iconStroked : false" [icon]="selectedOption!.icon ? selectedOption!.icon : ''"></yrx-icon>
    }
  </div>
</div>
