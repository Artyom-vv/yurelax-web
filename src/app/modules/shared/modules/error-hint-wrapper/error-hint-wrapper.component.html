<div class="error-hint-wrapper flex flex_column">
  <ng-container *ngFor="let hint of baseInput.hints">
    <ng-container *ngIf="hint.field | errorHintConditions | async">
      <yrx-error-hint @childTrigger *ngIf="hint.text$ | async as text" [text]="text"></yrx-error-hint>
    </ng-container>
  </ng-container>
</div>
