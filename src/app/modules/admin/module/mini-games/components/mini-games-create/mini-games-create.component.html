<div class="mini-games-create flex flex_column" [formGroup]="form" [class.mini-games-create_editing]="isEdit">
  <div class="flex flex_column gap-12">
    <div class="box box_input">
      <input formControlName="name" class="input_normal input_iconly input_dark" matInput placeholder="Название мини-игры">
      <yrx-error-hint-wrapper [control]="form.get('name')">
        <yrx-error-hint-condition [condition]="['required']">Это обязательное поле</yrx-error-hint-condition>
      </yrx-error-hint-wrapper>
    </div>
    <div class="box box_input">
      <textarea formControlName="description" class="input_normal input_iconly input_dark textarea" matInput placeholder="Описание мини-игры"></textarea>
      <yrx-error-hint-wrapper [control]="form.get('description')">
        <yrx-error-hint-condition [condition]="['required']">Это обязательное поле</yrx-error-hint-condition>
      </yrx-error-hint-wrapper>
    </div>
    <div class="box box_input">
      <input formControlName="icon" class="input_normal input_iconly input_dark" matInput placeholder="Иконка мини-игры">
      <yrx-error-hint-wrapper [control]="form.get('icon')">
        <yrx-error-hint-condition [condition]="['required']">Это обязательное поле</yrx-error-hint-condition>
      </yrx-error-hint-wrapper>
    </div>
    <div class="box box_input">
      <mat-checkbox formControlName="iconStroked">Использовать iconStroked</mat-checkbox>
    </div>
    <div class="box box_input">
      <input formControlName="miniGameKey" class="input_normal input_iconly input_dark" matInput placeholder="Ключ мини-игры">
      <yrx-error-hint-wrapper [control]="form.get('miniGameKey')">
        <yrx-error-hint-condition [condition]="['required']">Это обязательное поле</yrx-error-hint-condition>
        <yrx-error-hint-condition [condition]="['alreadyUse']">Такая мини-игра уже существует</yrx-error-hint-condition>
        <yrx-error-hint-condition [condition]="['notAllowedSymbol']">Ключ содержит недопустимые символы</yrx-error-hint-condition>
      </yrx-error-hint-wrapper>
    </div>
  </div>
  <yrx-spacing type="S"></yrx-spacing>
  <yrx-button *ngIf="!isEdit; else editTemplate" (press)="create()" class="flex_align-self-end" [disabled]="dataLoading || form.pending || form.invalid" [iconLoading]="dataLoading">
    <span>Создать</span>
    <yrx-icon btn-icon [stroked]="true" icon="loader"></yrx-icon>
  </yrx-button>
  <ng-template #editTemplate>
    <div class="flex gap-8 flex_align-self-end">
      <yrx-button (press)="edit()" [disabled]="dataLoading || form.pending || form.invalid" [iconLoading]="dataLoading">
        <span>Сохранить</span>
        <yrx-icon btn-icon [stroked]="true" icon="loader"></yrx-icon>
      </yrx-button>
      <yrx-button (press)="cancel()" custom="red" [disabled]="dataLoading || form.pending || form.invalid"><span>Отменить</span></yrx-button>
    </div>
  </ng-template>
</div>
