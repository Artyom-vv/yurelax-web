<yrx-admin-page-header eyebrow="Центр управления Yurelax" title="Контент сервера"
  description="Платформенные контракты, каталог и данные игроков в одном кабинете. Все изменения проходят через роли и остаются в аудите.">
</yrx-admin-page-header>

<yrx-spacing type="M"></yrx-spacing>

<yrx-admin-section-header title="Рабочие разделы"
  description="Выберите объект, который нужно проверить или изменить.">
</yrx-admin-section-header>
<yrx-spacing type="S"></yrx-spacing>

<yrx-admin-registry ariaLabel="Разделы администрирования">
  @for (item of navigation; track item.route) {
    <yrx-admin-registry-row>
      <a class="workspace-row" [routerLink]="item.route">
        <span class="workspace-row__icon"><yrx-icon [stroked]="true" [icon]="item.icon"></yrx-icon></span>
        <span class="workspace-row__copy">
          <span class="workspace-row__kicker">{{item.kicker}}</span>
          <strong>{{item.title}}</strong>
          <small>{{item.description}}</small>
        </span>
        <yrx-icon class="workspace-row__arrow" [stroked]="true" icon="arrow-right"></yrx-icon>
      </a>
    </yrx-admin-registry-row>
  }
</yrx-admin-registry>

<p class="admin-footnote">
  <yrx-icon [stroked]="true" icon="shield"></yrx-icon>
  Доступные действия определяются платформенными ролями; автор и результат каждой операции сохраняются.
</p>
