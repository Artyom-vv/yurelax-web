<div class="flex flex_align-center gap-12">
  <h3>Вики</h3>
  <yrx-link (press)="toolsService.redirect('https://github.com/yurelax-minecraft/yurelax-wiki')" [iconStroked]="true" icon="external-link">yurelax-wiki</yrx-link>
</div>
<yrx-spacing type="S"></yrx-spacing>

</yrx-button>
