name: Roll back web
run-name: Roll back web · ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      WEB_RELEASE_SHA: ${{ github.sha }}
      WEB_PRODUCTION_URL: ${{ vars.WEB_PRODUCTION_URL }}
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_WEB_APPLICATION_UUID: ${{ vars.COOLIFY_WEB_APPLICATION_UUID }}
      COOLIFY_WEB_APPLICATION_NAME: ${{ vars.COOLIFY_WEB_APPLICATION_NAME }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run test:deployment
      - name: Restore the latest independently successful predecessor
        run: npm run rollback:web
