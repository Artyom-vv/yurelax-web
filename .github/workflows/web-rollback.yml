name: Roll back web
run-name: Roll back web · ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/master'
    uses: Artyom-vv/yurelax-platform/.github/workflows/web-release.yaml@266195c0707be06f47d518570c4859b500f88ba3
    with:
      action: rollback
